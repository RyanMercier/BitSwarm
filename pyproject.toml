[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitswarm-redteam"
version = "0.1.0"
description = "Red-teaming BitSwarm's miner grader: can a coding agent game a real reward function?"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ryan Mercier" }]
requires-python = ">=3.11"
dependencies = ["anthropic", "openai", "pydantic", "pytest==8.3.5"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Repository = "https://github.com/RyanMercier/BitSwarm"
Documentation = "https://github.com/RyanMercier/BitSwarm/blob/redteam/redteam/README.md"

[project.optional-dependencies]
dev = ["ruff"]

[tool.setuptools.packages.find]
include = ["harness*", "miner*", "validator*", "protocol*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires a working Docker daemon and the bitswarm-base image"]

[tool.ruff]
line-length = 100
