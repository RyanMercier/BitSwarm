[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitswarm-harness"
version = "0.1.0"
description = "A durable, observable implementer-reviewer coding harness"
requires-python = ">=3.11"
dependencies = ["pytest==8.3.5"]

[project.scripts]
bitswarm = "harness.__main__:main"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires a working Docker daemon and bitswarm-harness:local image"]
