name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .[dev]
      - run: ruff check harness benchmarks acceptance tests/test_harness.py tests/test_action.py tests/test_review_regressions.py
      - run: python -m pytest tests/test_harness.py tests/test_action.py -q
      # The validator regression tests import the legacy merge pipeline,
      # which needs the provider SDKs even though no model is called.
      - run: python -m pip install anthropic openai fastapi httpx pydantic
      - run: python -m pytest tests/test_review_regressions.py -q
      - run: docker build -f docker/Dockerfile.harness -t bitswarm-harness:local .
      - run: python -m pytest tests/test_harness_docker.py -q
        env:
          BITSWARM_DOCKER_TESTS: '1'
      - run: python -m harness demo --out /tmp/bitswarm-ci-demo --sandbox docker
      - run: python -m harness replay /tmp/bitswarm-ci-demo
